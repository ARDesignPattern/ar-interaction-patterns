<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>{{ page.title }}</title>

    <link
      rel="canonical"
      href="{{ page.canonical | default: page.url | absolute_url | replace: 'index.html', '' }}"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />

    <link
      href="{{ '/css/layout_default.css' | relative_url }}"
      rel="stylesheet"
    />

    <link href="{{ '/css/cards.css' | relative_url }}" rel="stylesheet" />

    <link
      href="{{ '/css/layout_study.css' | relative_url }}"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      {% include header.html %}

      <main>
        <article class="study-page">
          <div class="study-hero">
            <p class="study-eyebrow">
              Study{% if page.study_number %} {{ page.study_number }}{% endif %}
            </p>

            <h1>{{ page.title }}</h1>

            {% if page.subtitle %}
            <p class="study-subtitle">{{ page.subtitle }}</p>
            {% endif %} {% if page.tags %}
            <div class="study-tags">
              {% for tag in page.tags %}
              <span>{{ tag }}</span>
              {% endfor %}
            </div>
            {% endif %}
          </div>

          <div class="study-body">{{ content }}</div>
        </article>
      </main>
    </div>

    {% include footer.html %}

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
